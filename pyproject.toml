[project]
name = "ipsc-rulebook-agent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["pymupdf", "fastembed", "numpy", "typer", "python-dotenv", "httpx",
                "fastapi", "uvicorn", "jinja2", "python-multipart"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]  # style errors, unused code, import order

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not eval'"
markers = ["eval: retrieval evaluation against the indexed database (needs `ipsc ingest` first)"]

[project.scripts]
ipsc = "ipsc.cli:app"
ipsc-web = "ipsc.web.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"ipsc.web" = ["templates/*.html", "static/*"]
